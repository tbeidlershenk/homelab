# doppler-save.sh writes /etc/homelab/.env (mode 0600). Compare checksums so
# services that source it restart only when a secret actually changed.
- name: Checksum of the env file before
  ansible.builtin.stat:
    path: "{{ etc_dir }}/.env"
  register: secrets_env_before

- name: Save Doppler secrets for systemd services
  ansible.builtin.command: "{{ repo_root }}/scripts/doppler-save.sh"
  changed_when: false
  no_log: true

- name: Checksum of the env file after
  ansible.builtin.stat:
    path: "{{ etc_dir }}/.env"
  register: secrets_env_after

- name: Note whether secrets changed
  ansible.builtin.set_fact:
    secrets_changed: "{{ secrets_env_before.stat.checksum | default('') != secrets_env_after.stat.checksum }}"
